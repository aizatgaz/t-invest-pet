openapi: 3.0.1
info:
  title: Sandbox API
  version: '1.0'
servers:
  - url: ../
security:
  - managerBearerAuth: []
paths:
  /api/v1/sandbox/accounts:
    get:
      summary: Получить счета
      operationId: getAccount
      parameters:
        - name: status
          in: query
          required: true
          description: Статус счетов
          schema:
            type: string
            enum:
              - ACCOUNT_STATUS_UNSPECIFIED
              - ACCOUNT_STATUS_NEW
              - ACCOUNT_STATUS_OPEN
              - ACCOUNT_STATUS_CLOSED
              - ACCOUNT_STATUS_ALL
          example: ACCOUNT_STATUS_ALL
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SandboxAccountViewResponse'
    post:
      summary: Создать учебный счёт
      operationId: postAccount
      requestBody:
        description: Название счёта
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostAccountRequest'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxAccountViewResponse'
  /api/v1/sandbox/accounts/sync:
    post:
      summary: Синхронизировать счета
      operationId: postAccountsSync
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SandboxAccountViewResponse'
  /api/v1/sandbox/accounts/{accountId}/pay-ins:
    parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Пополнить счёт
      operationId: postAccountsPayIns
      requestBody:
        description: Значение суммы
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostAccountPayInsRequest'
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxAccountViewResponse'
  /api/v1/sandbox/accounts/{accountId}/portfolio/refresh:
    parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Обновить стоимость портфеля
      operationId: postPortfolioRefresh
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxAccountViewResponse'
  /api/v1/sandbox/accounts/{accountId}/orders:
    parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Получить локальную витрину заявок
      operationId: getOrders
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SandboxOrderViewResponse'
    post:
      summary: Создать заявку
      operationId: postOrder
      requestBody:
        description: Запрос заявки
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostOrderRequest'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxOrderViewResponse'
  /api/v1/sandbox/accounts/{accountId}/orders/sync:
    parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Синхронизировать активные заявки
      operationId: postOrdersSync
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SandboxOrderViewResponse'
  /api/v1/sandbox/accounts/{accountId}/orders/{orderId}:
    parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Отменить заявку
      operationId: deleteOrder
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxOrderViewResponse'
  /api/support/auth:
    post:
      tags:
        - Support
      summary: Получить JWT с ролью MANAGER
      operationId: authenticate
      security:
        - supportBasicAuth: [ ]
      responses:
        200:
          description: JWT с ролью MANAGER успешно выдан
          headers:
            Cache-Control:
              description: Запрет кеширования ответа с токеном
              schema:
                type: string
            Pragma:
              description: Запрет кеширования для клиентов HTTP/1.0
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        401:
          description: Логин и пароль HTTP Basic отсутствуют или неверны
          headers:
            WWW-Authenticate:
              description: Требуемая схема аутентификации HTTP Basic
              schema:
                type: string
        403:
          description: Доступ запрещён; для выдачи токена требуется роль SUPPORT

components:
  securitySchemes:
    managerBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT с ролью MANAGER, полученный через POST /api/support/auth
    supportBasicAuth:
      type: http
      scheme: basic
      description: Логин и пароль пользователя с ролью SUPPORT
  schemas:
    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          format: jwt
          description: Подписанный JWT с ролью MANAGER для вызова защищённых методов API
        token_type:
          type: string
          enum:
            - Bearer
          example: Bearer
          description: Схема передачи access_token в заголовке Authorization
        expires_in:
          type: integer
          format: int64
          minimum: 1
          example: 1200
          description: Срок действия access_token в секундах с момента выдачи (20 минут)
    SandboxAccountViewResponse:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        totalAmountRub:
          type: number
          format: double
        updatedAt:
          type: string
          format: date-time
    SandboxOrderViewResponse:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        instrumentUid:
          type: string
          format: uuid
        direction:
          type: string
        quantity:
          type: integer
          format: int64
        orderType:
          type: string
        price:
          type: number
          format: double
        status:
          type: string
        updatedAt:
          type: string
          format: date-time
    PostAccountRequest:
      type: object
      properties:
        name:
          type: string
    PostAccountPayInsRequest:
      type: object
      properties:
        amount:
          type: number
          format: double
    PostOrderRequest:
      type: object
      properties:
        instrumentUid:
          type: string
          format: uuid
        direction:
          type: string
        quantity:
          type: integer
          format: int64
        orderType:
          type: string

databaseChangeLog:
  - changeSet:
      id: 001-create-table
      author: a.gazimov
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: account_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: total_amount_rub
                  type: DECIMAL(15, 2)
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: order_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_orders_account
                    references: accounts(account_id)
              - column:
                  name: instrument_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: direction
                  type: VARCHAR(8)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: order_type
                  type: VARCHAR(16)
              - column:
                  name: price
                  type: DECIMAL(15, 2)
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            columns:
              - column:
                  name: account_id
            indexName: idx_orders_account_id
            tableName: orders
